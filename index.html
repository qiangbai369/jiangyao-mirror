<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江遥的试衣间</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap">
<style>
/* One dark dressing room seen from the mirror. No text on screen: the mirror is the stage, the hangers are small portrait thumbnails.
   Landscape / wide: mirror on the left, a column of hangers on the right.
   Portrait (phones, tablets): mirror on top, one row of hangers underneath. */
:root{
  --room:#0e0a09;
  --brass:#b08a60;
  --brass-hi:#dcbd8c;
  --brass-dim:#5c4733;
  --pad:16px;
  --rail-w:108px;
  --strip:96px;          /* height reserved for the hanger row in the portrait layout: thumb (<=66px wide, 4:5) + padding */
  color-scheme:dark;
}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--room);
  background-image:radial-gradient(120% 70% at 50% 0%, rgba(74,16,19,.38), transparent 60%);
  padding:max(var(--pad), env(safe-area-inset-top, 0px)) max(var(--pad), env(safe-area-inset-right, 0px)) max(var(--pad), env(safe-area-inset-bottom, 0px)) max(var(--pad), env(safe-area-inset-left, 0px));
  box-sizing:border-box;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.room{height:100%;display:flex;gap:28px;align-items:center;justify-content:center}

/* ---------- mirror ---------- */
.mirror{
  --mh:min(calc(100vh - 40px), calc((100vw - var(--rail-w) - 28px - 2 * var(--pad)) * 1.7778));
  --mh:min(calc(100dvh - 40px), calc((100vw - var(--rail-w) - 28px - 2 * var(--pad)) * 1.7778));
  position:relative;height:var(--mh);width:calc(var(--mh) * .5625);flex:0 0 auto;
  border-radius:3px;padding:7px;box-sizing:border-box;
  background:linear-gradient(160deg,#d2aa7a 0%,#6e5236 22%,#b38c60 48%,#4d3a27 74%,#a07b52 100%);
  box-shadow:0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.7), 0 0 120px rgba(74,16,19,.35);
}
.mirror::after{content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,236,204,.28), inset 0 1px 0 rgba(255,244,222,.35)}
.glass{position:relative;width:100%;height:100%;overflow:hidden;background:#000;border-radius:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.stack{position:absolute;inset:0;z-index:1}
/* clips swap instantly: the next one is shown only once its first frame is playing, then the old one is hidden */
.glass video,.glass img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.0045)}}
.glass video.breathe{transform-origin:50% 80%;animation:breathe 5.2s ease-in-out infinite}
.glass video.on,.glass img.poster.on{opacity:1}
.glass video.fade{transition:opacity .24s linear}   /* only idle -> turn: hides the 3-4px head shift breathing leaves */
/* "let her turn": a small round icon inside the mirror, shown only while she stands in a look that has a turn clip */
.acts{position:absolute;right:12px;bottom:12px;z-index:7;display:flex;flex-direction:column;gap:10px}
.turn{all:unset;position:relative;width:42px;height:42px;border-radius:50%;cursor:pointer;touch-action:manipulation;
  display:grid;place-items:center;background:rgba(10,7,6,.45);border:1px solid rgba(220,189,140,.55);color:var(--brass-hi);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .35s, transform .15s, background .2s;opacity:0;pointer-events:none}
.turn.show{opacity:1;pointer-events:auto}
.turn:hover{background:rgba(176,138,96,.3)}
.turn:active{transform:scale(.92)}
.turn:focus-visible{outline:2px solid #f0e6da;outline-offset:3px}
.turn svg{width:20px;height:20px}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(220,189,140,0)}50%{box-shadow:0 0 0 6px rgba(220,189,140,.18)}}
.turn.hint{animation:nudge 2.2s ease-in-out infinite}
.glass.can-turn{cursor:grab;touch-action:none}
.glass.scrubbing{cursor:grabbing;touch-action:none}
.sheen{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:
    linear-gradient(115deg, transparent 30%, rgba(255,255,255,.045) 38%, transparent 46%),
    radial-gradient(140% 90% at 50% 45%, transparent 62%, rgba(0,0,0,.55) 100%);}
.dbg{position:absolute;left:8px;top:8px;z-index:9;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#9fe3a8;
  background:rgba(0,0,0,.6);padding:4px 7px;border-radius:2px;pointer-events:none;white-space:pre}

/* ---------- hangers ---------- */
.rail{flex:0 0 var(--rail-w);width:var(--rail-w);align-self:center;min-width:0;max-height:100%;display:flex}
.looks{display:flex;flex-direction:column;gap:12px;margin:0;padding:3px;list-style:none;overflow-y:auto;min-height:0;width:100%;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.look{all:unset;box-sizing:border-box;position:relative;display:block;width:100%;padding:5px;cursor:pointer;touch-action:manipulation;
  border:1px solid var(--brass-dim);border-radius:2px;background:rgba(255,255,255,.02);
  transition:border-color .2s, background .2s, transform .15s, box-shadow .2s}
.look img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:1px;pointer-events:none;-webkit-user-drag:none}
.look:hover{border-color:var(--brass);background:rgba(176,138,96,.1)}
.look:active{transform:scale(.97)}
.look:focus-visible{outline:2px solid #f0e6da;outline-offset:3px}
.look[aria-current="true"]{border-color:var(--brass-hi);background:rgba(176,138,96,.18);box-shadow:0 0 0 1px var(--brass-hi), 0 0 18px rgba(220,189,140,.25)}
.look[data-pending="true"]{border-style:dashed;border-color:var(--brass-hi)}
/* she is on her way but the clip is still downloading: a small ring instead of text */
@keyframes spin{to{transform:rotate(360deg)}}
.look[data-loading="true"]::after{content:"";position:absolute;right:9px;top:9px;width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(240,230,218,.25);border-top-color:#f0e6da;animation:spin .8s linear infinite;filter:drop-shadow(0 0 3px #000)}
/* before the first tap: the hangers breathe once in turn, so it is obvious they can be touched */
@keyframes beckon{0%,100%{box-shadow:0 0 0 0 rgba(220,189,140,0);border-color:var(--brass-dim)}45%{box-shadow:0 0 0 1px var(--brass-hi),0 0 16px rgba(220,189,140,.35);border-color:var(--brass-hi)}}
.looks.fresh .look{animation:beckon 2.6s ease-in-out infinite}
.looks.fresh li:nth-child(2) .look{animation-delay:.45s}
.looks.fresh li:nth-child(3) .look{animation-delay:.9s}
.looks.fresh li:nth-child(4) .look{animation-delay:1.35s}
.looks.fresh li:nth-child(5) .look{animation-delay:1.8s}

/* roomy desktops: larger hangers */
@media (min-width:1000px) and (min-aspect-ratio:5/4) and (min-height:700px){ :root{--rail-w:136px} .looks{gap:14px} }
/* short landscape screens (phones on their side) */
@media (max-height:520px){
  :root{--rail-w:68px}
  .looks{gap:8px}
}

/* ---------- portrait / narrow: mirror above, hangers in one row below ---------- */
@media (max-aspect-ratio:5/4){
  .room{flex-direction:column;gap:12px;justify-content:center}
  .mirror{--mh:min(calc(100vh - 2 * var(--pad) - var(--strip) - 12px), calc((100vw - 2 * var(--pad)) * 1.7778));
    --mh:min(calc(100dvh - 2 * var(--pad) - var(--strip) - 12px), calc((100vw - 2 * var(--pad)) * 1.7778))}
  .rail{flex:0 0 auto;width:100%;max-width:560px}
  .looks{flex-direction:row;justify-content:center;gap:8px;overflow-x:auto;overflow-y:hidden;padding:3px 2px;scroll-snap-type:x proximity}
  .looks li{flex:1 1 0;min-width:52px;max-width:66px;scroll-snap-align:center}
  .look{padding:4px}
}
@media (max-aspect-ratio:5/4) and (min-width:600px){
  :root{--strip:124px}
  .looks li{max-width:88px;min-width:70px}
}
@media (prefers-reduced-motion:reduce){ .glass video.breathe{animation:none} .looks.fresh .look{animation:none} .turn.hint{animation:none} }
</style>

<div class="room">
  <div class="mirror" id="mirror">
    <div class="glass" id="glass">
      <div class="stack" id="stack"><img class="poster on" id="poster" src="media/poster.jpg" alt="试衣间的镜子"></div>
      <div class="sheen"></div>
      <div class="dbg" id="dbg" hidden></div>
      <div class="acts">
      <button class="turn" id="near" type="button" aria-label="让她走近镜子"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
      <button class="turn" id="turn" type="button" aria-label="让她转身给你看"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg></button>
      </div>
    </div>
  </div>
  <aside class="rail" aria-label="衣架">
    <ul class="looks fresh" id="looks"></ul>
  </aside>
</div>

<script>
(() => {
  // intro = 空房间 -> 走出 -> 站定（结束在正面站姿）
  // idle  = 站着呼吸的循环（首尾同一帧，正放接倒放）
  // outro = 侧身 -> 转身 -> 走回屏风 -> 空房间
  const LOOKS = [
    { id:"leather", name:"黑色小羊皮方领裙", thumb:"media/thumb1.jpg",
      intro:"media/intro1.mp4", idle:"media/idle1.mp4", turn:"media/turn1.mp4", near:"media/near1.mp4", outro:"media/outro1.mp4",
      fidgets:["media/fidget1a.mp4","media/fidget1b.mp4"], react:"media/react1.mp4" },
    { id:"satin", name:"冷银灰缎面中长裙", thumb:"media/thumb2.jpg",
      intro:"media/intro2.mp4", idle:"media/idle2.mp4", outro:"media/outro2.mp4" },
    { id:"qipao", name:"月白提花短旗袍", thumb:"media/thumb3.jpg",
      intro:"media/intro3.mp4", outro:"media/outro3.mp4" },     // no idle clip yet: held frame + a faint breathing drift
  ];

  const stack = document.getElementById("stack");
  const poster = document.getElementById("poster");
  const list = document.getElementById("looks");
  const dbg = document.getElementById("dbg");
  const turnBtn = document.getElementById("turn");
  const nearBtn = document.getElementById("near");
  const glass = document.getElementById("glass");
  const used = { turn:false, near:false };       // the icon pulses gently until it has been used once

  // state: room (empty) | intro | standing | outro
  let state = "room", current = -1, pending = null, loadingLook = null, z = 1;
  const clips = {};          // per look: {intro, idle, outro}
  const allVideos = [];

  // Every clip starts out pointing at a 1 KB blank video. That is enough to unlock playback inside the first tap on a hanger (iOS needs a
  // play() from a tap on every element) without downloading the real clips; the real file is attached only when that look is wanted.
  const TINY = "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAANbbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAAH0AAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAoV0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAAH0AAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAB9AAAEAAABAAAAAAH9bWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAwAAAABgBVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABqG1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAWhzdGJsAAAAvHN0c2QAAAAAAAAAAQAAAKxhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAMmF2Y0MBZAAK/+EAF2dkAAqs2V7ARAAAAwAEAAADAMA8SJZYAQAEaO+Py/34+AAAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAC3gAAAt4AAAAAYc3R0cwAAAAAAAAABAAAAAwAAAgAAAAAUc3RzcwAAAAAAAAABAAAAAQAAAChjdHRzAAAAAAAAAAMAAAABAAAEAAAAAAEAAAYAAAAAAQAAAgAAAAAcc3RzYwAAAAAAAAABAAAAAQAAAAMAAAABAAAAIHN0c3oAAAAAAAAAAAAAAAMAAALGAAAADAAAAAwAAAAUc3RjbwAAAAAAAAABAAADiwAAAGJ1ZHRhAAAAWm1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALWlsc3QAAAAlqXRvbwAAAB1kYXRhAAAAAQAAAABMYXZmNjAuMTYuMTAwAAAACGZyZWUAAALmbWRhdAAAAq0GBf//qdxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjQgcjMxMDggMzFlMTlmOSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjMgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0xIHJlZj0xIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDM6MHgxMTMgbWU9aGV4IHN1Ym1lPTIgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MCBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTAgOHg4ZGN0PTEgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9MCB0aHJlYWRzPTEgbG9va2FoZWFkX3RocmVhZHM9MSBzbGljZWRfdGhyZWFkcz0wIG5yPTAgZGVjaW1hdGU9MSBpbnRlcmxhY2VkPTAgYmx1cmF5X2NvbXBhdD0wIGNvbnN0cmFpbmVkX2ludHJhPTAgYmZyYW1lcz0zIGJfcHlyYW1pZD0yIGJfYWRhcHQ9MSBiX2JpYXM9MCBkaXJlY3Q9MSB3ZWlnaHRiPTEgb3Blbl9nb3A9MCB3ZWlnaHRwPTEga2V5aW50PTI1MCBrZXlpbnRfbWluPTI0IHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9MTAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yMy4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCBpcF9yYXRpbz0xLjQwIGFxPTE6MS4wMACAAAAAEWWIhAAz/9J4Hu/tU5RwMT/5AAAACEGaIhiFf/7AAAAACAGeQUQr/8SB";
  function attach(v){
    if (!v || !v._real || v._attached) return;
    v._attached = true; v.preload = "auto";
    if (v._blob){
      // the turn clip is scrubbed by dragging, which needs a seekable source: load it whole into memory so it works on any host
      fetch(v._real).then(r => r.blob()).then(b => { v.src = URL.createObjectURL(b); v.load(); })
        .catch(() => { v.src = v._real; v.load(); });
    } else { v.src = v._real; v.load(); }
  }
  // short clips that start and end on the standing frame
  const MOVES = new Set(["turn", "near", "react", "fidget"]);
  const moveEls = c => [c.turn, c.near, c.react, ...(c.fidgets || [])].filter(Boolean);
  let moveEl = null, asks = 0, fidgetT = 0, lastFidget = -1, queuedMove = null;
  function mk(src, loop){
    const v = document.createElement("video");
    v._real = src; v.src = TINY; v.preload = "auto"; v.loop = !!loop;
    v.muted = true; v.defaultMuted = true; v.playsInline = true;
    v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
    v.disablePictureInPicture = true; v.disableRemotePlayback = true; v.setAttribute("tabindex","-1");
    stack.appendChild(v); allVideos.push(v);
    return v;
  }
  LOOKS.forEach((l, i) => {
    if (l.empty) return;
    clips[i] = { intro: mk(l.intro), idle: l.idle ? mk(l.idle, true) : null, turn: l.turn ? mk(l.turn) : null, outro: mk(l.outro) };
    if (clips[i].turn) clips[i].turn._blob = true;
    clips[i].near = l.near ? mk(l.near) : null;
    clips[i].react = l.react ? mk(l.react) : null;
    clips[i].fidgets = (l.fidgets || []).map(src => mk(src));
    moveEls(clips[i]).forEach(el => el.addEventListener("ended", () => { if (moveEl === el && MOVES.has(state)) onMoveEnd(); }));
    clips[i].intro.addEventListener("ended", () => { if (state === "intro") onIntroEnd(); });
    clips[i].outro.addEventListener("ended", () => { if (state === "outro") onOutroEnd(); });
  });

  // wardrobe: portrait thumbnails only; the names are for screen readers
  LOOKS.forEach((l, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<button class="look" type="button" data-i="${i}" aria-current="false" data-pending="false" data-loading="false" aria-label="${l.name}"><img src="${l.thumb}" alt="" draggable="false"></button>`;
    list.appendChild(li);
  });
  const lookBtns = [...list.querySelectorAll("button.look")];
  lookBtns.forEach(b => {
    b.addEventListener("click", () => choose(+b.dataset.i));
    // start fetching this look's clips as soon as a finger / pointer is near it
    ["pointerenter","focus","touchstart"].forEach(ev => b.addEventListener(ev, () => warm(+b.dataset.i), { passive:true }));
  });

  function render(){
    lookBtns.forEach(b => {
      const i = +b.dataset.i;
      b.setAttribute("aria-current", i === current && state !== "room" ? "true" : "false");
      b.setAttribute("data-pending", pending === i ? "true" : "false");
      b.setAttribute("data-loading", loadingLook === i ? "true" : "false");
    });
    const idle = (state === "standing" || state === "fidget") && pending === null && current >= 0;
    const canTurn = idle && !!clips[current].turn, canNear = idle && !!clips[current].near;
    turnBtn.classList.toggle("show", canTurn);  turnBtn.classList.toggle("hint", canTurn && !used.turn);
    nearBtn.classList.toggle("show", canNear);  nearBtn.classList.toggle("hint", canNear && !used.near && used.turn);
    glass.classList.toggle("can-turn", canTurn || canNear);
  }
  let entered = false;
  render();
  // the three opening clips are small; fetch them quietly once the page is idle so the first tap does not have to wait
  addEventListener("load", () => setTimeout(() => LOOKS.forEach((_, i) => attach(clips[i].intro)), 600));

  // fetch a look's clips on demand (the page used to pull all of them at once)
  function warm(i){
    const c = clips[i]; if (!c || c._warm) return; c._warm = true;
    [c.intro, c.idle, ...moveEls(c), c.outro].forEach(attach);
  }

  const ready = v => v.readyState >= 3 ? Promise.resolve() :
    new Promise(r => { const f = () => { v.removeEventListener("canplay", f); r(); }; v.addEventListener("canplay", f); setTimeout(r, 5000); });

  // start a clip from 0 and resolve only once its first frame has really been painted
  // (requestVideoFrameCallback), so the previous clip is never hidden before the new one is visible
  function playFrom(v){
    return new Promise(res => {
      let done = false;
      const fin = () => { if (!done){ done = true; res(); } };
      v._live = true;                                   // the unlock pass below must not touch a clip that is really playing
      try { v.currentTime = 0; } catch(e){}
      setTimeout(() => { if (v._live && v.paused && !v.ended && allVideos.includes(v) && v.classList.contains("on")) v.play().catch(() => {}); }, 700);
      const p = v.play(); if (p) p.catch(fin);
      if ("requestVideoFrameCallback" in v) v.requestVideoFrameCallback(() => fin());
      else v.addEventListener("timeupdate", fin, { once:true });
      setTimeout(fin, 1500);
    });
  }
  // put `el` on top, then hide/pause the others one frame later so there is never a gap
  let topEl = null;
  function showOnly(el, fade){
    topEl = el;
    el.classList.toggle("fade", !!fade);
    el.style.zIndex = ++z; el.classList.add("on");
    // keep the old clip underneath for a few frames: if the new layer is slow to rasterise (first use), the old one still shows.
    // If another swap happens meanwhile, that newer swap does the clean-up instead (a stale timer must not hide the newer clip).
    setTimeout(() => {
      if (topEl !== el) return;
      allVideos.forEach(v => { if (v !== el){ v.classList.remove("on", "fade"); if (!v.paused) v.pause(); } });
      poster.classList.remove("on");
    }, fade ? 300 : 140);
  }
  // every transition takes a ticket; a slower, older transition that finishes late must not hide the newer clip
  let seq = 0;
  async function begin(v, tok, fade){
    attach(v);            // no-op when the real clip is already attached
    await ready(v);       if (tok !== seq) return false;
    await playFrom(v);    if (tok !== seq){ v.pause(); return false; }
    showOnly(v, fade); return true;
  }

  async function startIntro(i){
    state = "intro"; current = i; pending = null; asks = 0; render();
    const c = clips[i], tok = ++seq;
    warm(i);
    // a ring on the hanger (not text) shows she is coming but the clip is still arriving; only after a short delay so quick loads stay clean
    const slow = setTimeout(() => { if (tok === seq && topEl !== c.intro){ loadingLook = i; render(); } }, 350);
    const ok = await begin(c.intro, tok);
    clearTimeout(slow);
    if (loadingLook === i) loadingLook = null;
    render();
    if (ok) setTimeout(() => LOOKS.forEach((_, k) => warm(k)), 1200);   // once she is on screen, quietly fetch the rest
  }
  async function onIntroEnd(){
    state = "standing";
    if (pending !== null){ startOutro(); return; }     // a click was queued while she walked out
    render();
    // no idle loop: the intro simply stays on its last frame, and a barely-there breathing drift runs on top
    const c = clips[current];
    if (c.idle) await begin(c.idle, ++seq);            // breathing + one blink, first/last frame identical, native loop
    else c.intro.classList.add("breathe");             // fallback until this look has its own breathing clip
    armFidget();
  }
  // left alone for a while, she does something small on her own (hair, weight shift)
  function armFidget(){
    clearTimeout(fidgetT);
    const c = clips[current]; if (!c || !c.fidgets.length) return;
    fidgetT = setTimeout(() => { if (state === "standing" && pending === null && !press) startMove("fidget", false); }, 9000 + Math.random() * 5000);
  }
  // standing -> a short move -> standing again. Each move clip starts and ends on the standing frame.
  //   turn:   she turns to show the back, glances at the mirror over her shoulder, turns back   (tap / drag / icon)
  //   near:   she comes up to the mirror and holds your eye, then steps back                  (long press / icon)
  //   react:  after you have asked three times in a row, the fourth ask gets crossed arms and a cool look instead
  //   fidget: nobody has touched anything for a while, so she fixes her hair or shifts her weight
  async function startMove(kind, byUser = true){
    const c = clips[current];
    if (!c || pending !== null) return;
    if (state === "fidget" && byUser){ if (c[kind]) queuedMove = kind; return; }   // she finishes the little gesture first
    if (state !== "standing") return;
    clearTimeout(fidgetT);
    let el = null, st = kind;
    if (kind === "fidget"){
      if (!c.fidgets.length) return;
      let k = Math.floor(Math.random() * c.fidgets.length);
      if (c.fidgets.length > 1 && k === lastFidget) k = (k + 1) % c.fidgets.length;
      lastFidget = k; el = c.fidgets[k]; asks = 0;                // she has had a rest: the patience counter resets
    } else {
      if (!c[kind]) return;
      used[kind] = true;
      if (byUser && ++asks > 3 && c.react){ asks = 0; st = "react"; el = c.react; }
      if (!el) el = c[kind];
    }
    state = st; moveEl = el; render();
    [c.intro, ...moveEls(c)].forEach(v => v.classList.remove("breathe"));
    await begin(el, ++seq, true);                      // from the breathing loop: a 0.24 s dissolve hides the small head shift
  }
  const startTurn = () => startMove("turn");
  async function onMoveEnd(){
    const done = moveEl; moveEl = null;
    state = "standing";
    if (pending !== null){ queuedMove = null; startOutro(); return; }   // a hanger was tapped during the move
    if (queuedMove){ const k = queuedMove; queuedMove = null; startMove(k); return; }
    render();
    const c = clips[current];
    if (c.idle) await begin(c.idle, ++seq);            // the move ends on the same frame the breathing loop starts on
    else done.classList.add("breathe");
    armFidget();
  }
  async function startOutro(){
    state = "outro"; render();
    clips[current].intro.classList.remove("breathe");
    clearTimeout(fidgetT); queuedMove = null;
    moveEls(clips[current]).forEach(v => v.classList.remove("breathe"));
    await begin(clips[current].outro, ++seq);
  }
  function onOutroEnd(){
    state = "room";
    const p = pending; pending = null;
    if (p !== null){ startIntro(p); return; }
    current = -1; render();
  }

  // iOS only lets a video play() later if it was started inside a tap: the first tap on a hanger starts every (blank) element once
  function unlock(){
    entered = true; list.classList.remove("fresh");
    allVideos.forEach(v => {
      v.muted = true;
      const p = v.play();
      if (p) p.then(() => { if (!v._live){ v.pause(); v.currentTime = 0; } }).catch(() => {});
    });
  }
  function choose(i){
    if (!LOOKS[i]) return;
    if (!entered) unlock();
    if (state === "room"){ startIntro(i); return; }
    if ((state === "intro" || state === "standing" || MOVES.has(state)) && i === current && pending === null) return;   // she is already wearing it: do nothing
    pending = i; clearTimeout(fidgetT); render();
    if (state === "standing") startOutro();            // intro/outro in progress: the click waits its turn
  }

  turnBtn.addEventListener("click", e => { e.stopPropagation(); startMove("turn"); });
  nearBtn.addEventListener("click", e => { e.stopPropagation(); startMove("near"); });

  // Drag across the mirror and she turns with your finger (the turn clip is scrubbed: 0 s = facing you, SCRUB_END = her back).
  // Let go and the clip plays on from there: she glances back at the mirror and turns round on her own. A plain tap plays the whole turn.
  const SCRUB_END = 2.4, DRAG_PX = 10;
  let press = null, scrubbing = false, scrubT = 0, seekBusy = false, suppressClick = false;
  const seekTo = v => {
    if (seekBusy) return;                              // one seek at a time keeps phones smooth; the latest position wins on "seeked"
    seekBusy = true;
    const go = () => { seekBusy = false; if (scrubbing && Math.abs(v.currentTime - scrubT) > 0.03) seekTo(v); };
    v.addEventListener("seeked", go, { once:true });
    try { v.currentTime = scrubT; } catch(e){ seekBusy = false; }
  };
  glass.addEventListener("pointerdown", e => {
    if (state !== "standing" || pending !== null || e.target.closest(".turn")) return;
    clearTimeout(fidgetT);
    const c = clips[current]; if (!c || (!c.turn && !c.near)) return;
    press = { x:e.clientX, id:e.pointerId, w:glass.clientWidth };
    // hold still on the mirror (no drag) and she comes closer
    if (c.near) press.hold = setTimeout(() => { if (press && !scrubbing){ press = null; suppressClick = true; startMove("near"); } }, 480);
  });
  glass.addEventListener("pointermove", e => {
    if (!press || e.pointerId !== press.id) return;
    const dx = Math.abs(e.clientX - press.x);
    const c = clips[current];
    if (!scrubbing){
      if (dx < DRAG_PX || state !== "standing" || !c.turn || c.turn.readyState < 2 || !c.turn.seekable.length) return;
      clearTimeout(press.hold);
      scrubbing = true; state = "turn"; moveEl = c.turn; used.turn = true; asks++; clearTimeout(fidgetT); ++seq; render();
      glass.classList.add("scrubbing"); glass.setPointerCapture(press.id);
      c.intro.classList.remove("breathe");
      c.turn.pause(); try { c.turn.currentTime = 0; } catch(err){}
      showOnly(c.turn, true);
    }
    scrubT = Math.min(1, Math.max(0, (dx - DRAG_PX) / (press.w * 0.75))) * SCRUB_END;
    seekTo(c.turn);
  });
  const release = e => {
    if (!press || (e && e.pointerId !== press.id)) return;
    clearTimeout(press.hold); press = null;
    if (!scrubbing) return;
    scrubbing = false; suppressClick = true; glass.classList.remove("scrubbing");
    const v = clips[current].turn;
    v.play().catch(() => {});                          // carry on from where the finger left her: glance, then turn back
  };
  glass.addEventListener("pointerup", release);
  glass.addEventListener("pointercancel", release);
  glass.addEventListener("click", () => {
    if (suppressClick){ suppressClick = false; return; }
    if (state === "standing" || state === "fidget") startTurn();   // tapping the mirror plays the whole turn
  });
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === " " && e.target === document.body){ e.preventDefault(); startMove("turn"); return; }
    if (e.key === "ArrowUp"){ e.preventDefault(); startMove("near"); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= LOOKS.length) choose(n - 1);
  });
  document.addEventListener("visibilitychange", () => {
    const act = state === "intro" ? clips[current].intro : state === "standing" ? (clips[current].idle || null) : MOVES.has(state) ? moveEl : state === "outro" ? clips[current].outro : null;
    if (!act) return;
    if (document.hidden) act.pause(); else act.play().catch(() => {});
  });

  // ?debug=1 shows what the state machine is doing
  if (new URLSearchParams(location.search).get("debug") === "1"){
    dbg.hidden = false;
    const upd = () => {
      const act = current < 0 ? null : MOVES.has(state) ? moveEl : clips[current][state === "intro" ? "intro" : state === "outro" ? "outro" : (clips[current].idle ? "idle" : "intro")];
      dbg.textContent = `state ${state}   look ${current}   pending ${pending}\n` + (act && state !== "room" ? `${state}  ${act.currentTime.toFixed(2)} / ${(act.duration || 0).toFixed(2)}s` : "—");
      requestAnimationFrame(upd);
    };
    upd();
  }
  // test hook for automated checks
  window.__jy = { get asks(){ return asks; }, fidgetNow(){ if (state === "standing") startMove("fidget", false); }, get scrubbing(){ return scrubbing; }, get state(){ return state; }, get current(){ return current; }, get pending(){ return pending; }, choose };
})();
</script>
